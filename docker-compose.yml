name: lucky-draw-prod

services:
  # --- 1. FastAPI (API Gateway) ---
  api:
    build:
      context: ./lucky_draw_api
    restart: always
    ports:
      - "3026:3026" # Bind to localhost so Nginx handles the public traffic
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=lucky-draw-uploads
      # CRITICAL: This must be the public domain Nginx gives to MinIO
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT}
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - prod-net

  # --- 2. Database Worker (Scalable) ---
  worker:
    build:
      context: ./lucky_draw_api
    restart: always
    # Run the worker using the built image's environment
    command: ["uv", "run", "python", "src/lucky_draw_api/worker.py"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: 3 # Instantly scale to 3 workers to drain the queue faster
    networks:
      - prod-net

  # --- 3. MinIO ---
  minio:
    image: minio/minio
    restart: always
    ports:
      - "9000:9000" # S3 API (Proxied by Nginx)
      - "9001:9001" # Web Console (Proxied by Nginx)
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
      - MINIO_API_CORS_ALLOW_ORIGIN=*
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - prod-net

  # --- 4. Redis ---
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - prod-net

  # --- 5. RabbitMQ ---
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - prod-net

volumes:
  minio_data:
  redis_data:
  rabbitmq_data:

networks:
  prod-net:
    driver: bridge
